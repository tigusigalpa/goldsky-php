name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        if: matrix.php != '8.1'
        run: composer install --no-interaction --prefer-dist --no-progress

      # composer.lock currently resolves PHPUnit 11, which needs PHP 8.2+.
      # Resolve the allowed PHPUnit 10 release under the package's minimum
      # supported runtime so PHP 8.1 is verified on every change.
      - name: Resolve dependencies for PHP 8.1
        if: matrix.php == '8.1'
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Lint PHP files
        run: |
          find src config examples tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: vendor/bin/phpunit --no-coverage

      - name: Audit dependencies
        run: composer audit --locked --no-interaction
